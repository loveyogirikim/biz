# .github/workflows/announcements.yml
# ============================================================
# 역할: 사업계획서 도우미의 "최근 공고" 목록(public/data/announcements.json)을
#       매일 갱신해 커밋합니다. Vercel이 push를 감지해 자동 재배포합니다.
#       (기존 daily.yml 의 Notion 수집과는 별개로 동작합니다)
# 필요 Secret: BIZINFO_API_KEY (daily.yml 과 같은 키)
# ============================================================

name: 공고 목록 갱신 (사업계획서 도우미)

on:
  schedule:
    - cron: "10 0,6 * * *"   # 매일 09:10, 15:10 (KST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 공고 목록 만들기
        run: python scripts/export_announcements.py
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}

      - name: 변경 사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/announcements.json
          git diff --cached --quiet || git commit -m "chore: update announcements $(date +'%Y-%m-%d %H:%M')"
          git push
